name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Protocol, runtime, plugin, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout with upstream submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cargo \
            flatbuffers-compiler \
            glslang-tools \
            libegl-dev \
            libflatbuffers-dev \
            libgif-dev \
            libgl-dev \
            libglfw3-dev \
            libjpeg-dev \
            libpng-dev \
            libvulkan-dev \
            libwayland-dev \
            libwebp-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            meson \
            ninja-build \
            pkg-config \
            python3-mako \
            shellcheck

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Select Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Build Decky frontend
        run: |
          pnpm --dir plugin install --frozen-lockfile
          pnpm --dir plugin verify

      - name: Check shell and repository hygiene
        run: |
          git diff --check
          mapfile -t scripts < <(git ls-files 'packaging/*.sh' 'tools/*.sh')
          shellcheck "${scripts[@]}"
          for script in "${scripts[@]}"; do
            bash -n "${script}"
          done

      - name: Configure Game Mode runtime tests
        run: |
          meson setup build/ci . \
            --buildtype=debug \
            -Dinclude_doc=false \
            -Dmango_overlay_decky=enabled \
            -Dmangoapp=true \
            -Dmangohudctl=false \
            -Dmangoplot=disabled \
            -Dtests=enabled \
            -Dwith_dbus=disabled \
            -Dwith_nvml=disabled \
            -Dwith_xnvctrl=disabled

      - name: Build and run the complete test suite
        run: |
          meson compile -C build/ci
          meson test -C build/ci --print-errorlogs --no-rebuild
